name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Re-query the advisory service even when the lockfile has not changed.
    - cron: '17 13 * * 1'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - name: Check npm audit against reviewed baseline
        run: npm run audit:check
